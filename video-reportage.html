</head>
<body>

    <nav>

      <a href="photo.html">Фото</a>

  </header>

  <section class="page-hero">
    <div class="container">
      <a href="video.html" class="back-link">← Все категории</a>
      <div class="section-number">Reportage</div>
      <h1 class="page-title">Репортажка</h1>
      <p class="page-lead">
        Живые репортажи с событий и мероприятий.
      </p>

  <section class="video-grid-section">
    <div class="container">
      <div class="video-grid">

        <a href="video/reportage/reportage-01.mp4" class="video-card video-link">
          <div class="video-cover">
            <video src="video/reportage/reportage-01.mp4#t=3" muted preload="metadata" playsinline></video>
            <span class="video-play">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </span>
          </div>
          <div class="video-meta">
            <h3 class="video-name">Название репортажа 01</h3>
            <span class="video-tag">Reportage</span>
          </div>
        </a>

        <a href="video/reportage/reportage-02.mp4" class="video-card video-link">
          <div class="video-cover">
            <video src="video/reportage/reportage-02.mp4#t=3" muted preload="metadata" playsinline></video>
            <span class="video-play">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </span>
          </div>
          <div class="video-meta">
            <h3 class="video-name">Название репортажа 02</h3>

        <!-- Добавляй новые видео по образцу -->

      </div>

  <footer>
    <span>© 2026 Фаниль</span>
    <span>Kazan, Russia</span>
  </footer>

  <!-- Видео-лайтбокс -->
  <div class="video-lightbox" id="video-lightbox">
    <span class="video-lightbox-close" id="video-lightbox-close">×</span>
    <span class="video-lightbox-prev" id="video-lightbox-prev">‹</span>
    <span class="video-lightbox-next" id="video-lightbox-next">›</span>
    <video id="video-lightbox-player" controls playsinline preload="metadata"></video>
  </div>

  <script>
    const videoLightbox = document.getElementById("video-lightbox");
    const videoPlayer = document.getElementById("video-lightbox-player");
    const videoClose = document.getElementById("video-lightbox-close");
    const videoPrev = document.getElementById("video-lightbox-prev");
    const videoNext = document.getElementById("video-lightbox-next");

    const videoLinks = Array.from(document.querySelectorAll(".video-link"));
    let videoIndex = 0;

    function showVideo(index) {
      videoIndex = (index + videoLinks.length) % videoLinks.length;
      videoPlayer.src = videoLinks[videoIndex].getAttribute("href");
      videoPlayer.play();
    }

    function openVideoLightbox(index) {
      showVideo(index);
      videoLightbox.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeVideoLightbox() {
      videoLightbox.classList.remove("active");
      videoPlayer.pause();
      videoPlayer.src = "";
      document.body.style.overflow = "";
    }

    videoLinks.forEach(function (link, i) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        openVideoLightbox(i);
      });
    });

    videoClose.addEventListener("click", closeVideoLightbox);
    videoPrev.addEventListener("click", function (e) {
      e.stopPropagation();
      showVideo(videoIndex - 1);
    });
    videoNext.addEventListener("click", function (e) {
      e.stopPropagation();
      showVideo(videoIndex + 1);
    });

    videoLightbox.addEventListener("click", function (e) {
      if (e.target === videoLightbox) closeVideoLightbox();
    });

    document.addEventListener("keydown", function (e) {
      if (!videoLightbox.classList.contains("active")) return;
      if (e.key === "Escape") closeVideoLightbox();
      if (e.key === "ArrowLeft") showVideo(videoIndex - 1);
      if (e.key === "ArrowRight") showVideo(videoIndex + 1);
    });
  </script>

</body>
</html>
