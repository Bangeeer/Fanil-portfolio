<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фаниль — Photographer &amp; Videographer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a href="index.html" class="logo">ФАНИЛЬ</a>
    <nav>
      <a href="index.html" class="active">Главная</a>
      <a href="video.html">Видео</a>
      <a href="photo.html">Фото</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <!-- HERO: только видео -->
  <section class="hero-video-bg">
    <video class="hero-bg-video" autoplay muted loop playsinline preload="metadata">
      <source src="video/showreel.mp4" type="video/mp4" />
    </video>
  </section>

  <!-- ABOUT -->
  <section class="about-section" id="about">
    <div class="container">

      <div class="about-top">
        <div class="about-hero">
          <h1>ФАНИЛЬ</h1>
          <div class="hero-label">Photographer / Videographer — Kazan</div>
          <div class="hero-subtitle">
            Фотограф и видеограф из Казани.<br />
            Снимаю людей, события, бренды<br />
            и истории, которые хочется пересматривать.
          </div>
        </div>

        <div class="about-photo">
          <img src="Image/Portrait.jpg" alt="Фаниль" />
        </div>
      </div>

    </div>
  </section>

  <!-- Ссылки на разделы -->
  <section id="explore">
    <div class="container">
      <div class="explore-links">
        <a href="video.html" class="btn">Смотреть видео →</a>
        <a href="photo.html" class="btn btn-outline">Смотреть фото →</a>
      </div>
    </div>
  </section>

  <footer>
    <span>© 2026 Фаниль</span>
    <span>Kazan, Russia</span>
  </footer>

</body>
</html>
