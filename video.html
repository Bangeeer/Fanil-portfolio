<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видео — Фаниль</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a href="index.html" class="logo">ФАНИЛЬ</a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="video.html" class="active">Видео</a>
      <a href="photo.html">Фото</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <section class="page-hero">
    <div class="container">
      <div class="section-number">Video</div>
      <h1 class="page-title">Видео</h1>
      <p class="page-lead">
        Рекламные ролики, музыкальные клипы, репортажи и клипы для соцсетей.
      </p>
    </div>
  </section>

  <section class="video-list">
    <div class="container">

      <!-- Видео 1 -->
      <div class="video-item">
        <div class="video-info">
          <div class="section-number">01 — Showreel</div>
          <h2 class="video-title">Showreel 2026</h2>
        </div>
        <video
          class="showreel-video"
          controls
          playsinline
          preload="metadata">
          <source src="video/showreel.mp4" type="video/mp4" />
          Ваш браузер не поддерживает видео.
        </video>
      </div>

      <!-- Видео 2 -->
      <div class="video-item">
        <div class="video-info">
          <div class="section-number">02 — Music video</div>
          <h2 class="video-title">Айлана — Хыялый</h2>
        </div>
        <video
          class="showreel-video"
          controls
          playsinline
          preload="metadata">
          <source src="video/Music video/Айлана - Хыялый.mp4" type="video/mp4" />
          Ваш браузер не поддерживает видео.
        </video>
      </div>

    </div>
  </section>

  <footer>
    <span>© 2026 Фаниль</span>
    <span>Kazan, Russia</span>
  </footer>

</body>
</html>
